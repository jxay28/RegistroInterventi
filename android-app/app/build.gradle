plugins {
    id 'com.android.application'
}

android {
    namespace 'it.registrointerventi'
    compileSdk 35
    buildToolsVersion '35.0.0'

    signingConfigs {
        personal {
            storeFile file('registro-interventi.keystore')
            storePassword 'registrointerventi2026'
            keyAlias 'registro'
            keyPassword 'registrointerventi2026'
        }
    }

    defaultConfig {
        applicationId 'it.registrointerventi'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.personal
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
